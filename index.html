<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindNotes - v2.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link CDN atualizado e mais robusto -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --sidebar-bg: #ffffff;
            --accent: #6366f1;
            --add-btn-color: var(--accent);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            overflow: hidden; 
        }

        .app-container {
            display: grid;
            grid-template-columns: auto auto 1fr;
            height: 100vh;
            transition: all 0.3s ease;
        }

        /* Coluna 1: Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #e2e8f0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .sidebar.collapsed { width: 80px; }
        .sidebar.collapsed .hide-on-collapse { display: none; }
        .sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }
        .sidebar.collapsed .nav-item i { margin-right: 0; font-size: 1.2rem; }

        /* Estilo do Botão Adicionar Nota */
        .add-note-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            color: var(--add-btn-color);
            font-weight: 600;
            font-size: 15px;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .add-note-btn:hover { opacity: 0.8; }

        .add-note-icon-circle {
            width: 24px;
            height: 24px;
            background-color: var(--add-btn-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Coluna 2: Lista de Notas */
        .notes-list-col {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        /* Coluna 3: Conteúdo */
        .content-col {
            background: #fcfcfd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        .note-list-item {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .note-list-item:hover { background-color: #f8fafc; }
        .note-list-item.active {
            background-color: #eef2ff;
            border-left-color: var(--accent);
        }

        .indicator-gray { background-color: #94a3b8; }
        .indicator-blue { background-color: #60a5fa; }
        .indicator-green { background-color: #4ade80; }
        .indicator-yellow { background-color: #fbbf24; }
        .indicator-red { background-color: #f87171; }
        .indicator-purple { background-color: #a78bfa; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        .editor-input {
            border: none;
            outline: none;
            width: 100%;
            background: transparent;
        }

        /* Modal / Lightbox Search */
        #searchLightbox {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="app-container" id="mainContainer">
        <!-- Coluna 1: Navegação -->
        <aside class="sidebar p-4" id="sidebar">
            <div class="flex items-center justify-between mb-6 px-2 text-nowrap">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shrink-0">
                        <i class="fa-solid fa-feather-pointed"></i>
                    </div>
                    <h1 class="font-bold text-xl tracking-tight text-slate-800 hide-on-collapse">MindNotes</h1>
                </div>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-indigo-600 transition p-2">
                    <i class="fa-solid fa-bars" id="collapseIcon"></i>
                </button>
            </div>

            <div class="px-2 mb-6">
                <button onclick="createNewNote()" class="add-note-btn w-full">
                    <div class="add-note-icon-circle">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <span class="hide-on-collapse">Adicionar nota</span>
                </button>
            </div>

            <nav class="flex-grow overflow-y-auto custom-scrollbar">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-4 mb-4 hide-on-collapse">Acesso Rápido</p>
                <div class="mb-8">
                    <!-- Novo Botão de Buscar -->
                    <div onclick="openSearchLightbox()" class="nav-item group">
                        <i class="fa-solid fa-magnifying-glass w-5 text-center text-indigo-600"></i> 
                        <span class="hide-on-collapse">Buscar nota</span>
                        <span class="ml-auto text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-400 hide-on-collapse">⌘K</span>
                    </div>

                    <div onclick="filterByCategory('all')" id="filterAll" class="nav-item">
                        <i class="fa-solid fa-layer-group w-5 text-center"></i> <span class="hide-on-collapse">Todas as Notas</span>
                    </div>
                    <div onclick="filterByCategory('favorites')" id="filterFavorites" class="nav-item">
                        <i class="fa-solid fa-star w-5 text-center"></i> <span class="hide-on-collapse">Favoritos</span>
                    </div>
                    <div class="nav-item">
                        <i class="fa-regular fa-clock w-5 text-center"></i> <span class="hide-on-collapse">Recentes</span>
                    </div>
                </div>

                <div class="flex items-center justify-between px-4 mb-4">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest hide-on-collapse">Etiquetas</span>
                    <button onclick="promptNewCategory()" class="text-indigo-600 hover:text-indigo-800 hide-on-collapse">
                        <i class="fa-solid fa-circle-plus"></i>
                    </button>
                </div>
                <div id="categoriesList" class="space-y-1 mb-8"></div>
            </nav>

            <div class="mt-auto p-4 bg-slate-50 rounded-2xl hide-on-collapse">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs">U</div>
                    <div class="text-xs text-nowrap">
                        <p class="font-bold text-slate-700 leading-none">Utilizador</p>
                        <p class="text-slate-400 mt-1">v2.7 Pro</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Coluna 2: Lista de Cards -->
        <section class="notes-list-col">
            <div class="p-6 border-b border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Notas</h2>
                    <button onclick="createNewNote()" class="flex items-center justify-center w-9 h-9 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all active:scale-95" title="Nova Nota">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-300 text-sm"></i>
                    <input type="text" id="searchBox" placeholder="Procurar..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-100 outline-none transition">
                </div>
            </div>
            
            <div id="notesGrid" class="flex-grow overflow-y-auto custom-scrollbar">
                <!-- Lista de notas injetada via JS -->
            </div>
        </section>

        <!-- Coluna 3: Visualizador / Editor -->
        <main class="content-col" id="contentArea">
            <div id="editorPlaceholder" class="flex flex-col items-center justify-center h-full text-slate-300">
                <i class="fa-solid fa-feather text-6xl mb-4 opacity-10"></i>
                <p>Selecione uma nota para visualizar</p>
            </div>

            <div id="editorContent" class="hidden flex flex-col h-full">
                <!-- Barra de Ferramentas -->
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white px-8">
                    <span id="saveStatus" class="text-xs font-medium text-slate-400">Alterações salvas</span>
                    <div class="flex gap-4">
                        <button onclick="toggleFavoriteActive()" id="favoriteBtn" class="transition">
                            <i id="favoriteIcon" class="fa-regular fa-star text-slate-300 hover:text-amber-400"></i>
                        </button>
                        <button onclick="deleteActiveNote()" class="text-slate-300 hover:text-rose-500 transition"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                </div>

                <!-- Conteúdo -->
                <div class="p-12 max-w-4xl w-full mx-auto flex-grow">
                    <div class="flex gap-3 mb-6">
                        <div id="activeColorTag" class="w-4 h-4 rounded-full mt-2"></div>
                        <input type="text" id="editTitle" class="editor-input text-4xl font-extrabold text-slate-900 placeholder:text-slate-200" placeholder="Título da Nota">
                    </div>
                    
                    <div class="flex gap-2 mb-8">
                        <label class="cursor-pointer"><input type="radio" name="color" value="gray" onchange="updateNoteStyle()" class="hidden peer"><div class="w-6 h-6 rounded-full bg-slate-400 ring-offset-2 peer-checked:ring-2 peer-checked:ring-slate-400"></div></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="blue" onchange="updateNoteStyle()" class="hidden peer"><div class="w-6 h-6 rounded-full bg-blue-400 ring-offset-2 peer-checked:ring-2 peer-checked:ring-blue-400"></div></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="green" onchange="updateNoteStyle()" class="hidden peer"><div class="w-6 h-6 rounded-full bg-emerald-400 ring-offset-2 peer-checked:ring-2 peer-checked:ring-emerald-400"></div></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="yellow" onchange="updateNoteStyle()" class="hidden peer"><div class="w-6 h-6 rounded-full bg-amber-400 ring-offset-2 peer-checked:ring-2 peer-checked:ring-amber-400"></div></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="red" onchange="updateNoteStyle()" class="hidden peer"><div class="w-6 h-6 rounded-full bg-rose-400 ring-offset-2 peer-checked:ring-2 peer-checked:ring-rose-400"></div></label>
                        <label class="cursor-pointer"><input type="radio" name="color" value="purple" onchange="updateNoteStyle()" class="hidden peer"><div class="w-6 h-6 rounded-full bg-indigo-400 ring-offset-2 peer-checked:ring-2 peer-checked:ring-indigo-400"></div></label>
                    </div>

                    <textarea id="editContent" class="editor-input text-lg text-slate-600 leading-relaxed min-h-[500px] resize-none placeholder:text-slate-200" placeholder="Comece a escrever aqui..."></textarea>
                </div>
            </div>
        </main>
    </div>

    <!-- Lightbox de Busca Global -->
    <div id="searchLightbox" class="fixed inset-0 z-[100] hidden flex items-start justify-center pt-24 px-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[70vh]">
            <div class="p-4 border-b border-slate-100 flex items-center gap-4">
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                <input type="text" id="globalSearchInput" placeholder="Procurar em todas as notas, textos ou informações..." class="flex-grow outline-none text-lg text-slate-700">
                <kbd class="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-400 font-sans">ESC</kbd>
            </div>
            <div id="globalResults" class="overflow-y-auto custom-scrollbar flex-grow bg-slate-50">
                <!-- Resultados da busca global -->
                <div class="p-8 text-center text-slate-400">Digite algo para começar a buscar...</div>
            </div>
        </div>
        <!-- Overlay de fechar -->
        <div class="absolute inset-0 -z-10" onclick="closeSearchLightbox()"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-10 left-10 bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl transition-all translate-y-20 opacity-0 z-50 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Mensagem</span>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('my_personal_notes')) || [];
        let categories = JSON.parse(localStorage.getItem('my_categories')) || ['Trabalho', 'Pessoal', 'Ideias'];
        let currentFilter = 'all';
        let activeNoteId = null;
        let autoSaveTimer = null;

        const sidebar = document.getElementById('sidebar');
        const notesGrid = document.getElementById('notesGrid');
        const searchBox = document.getElementById('searchBox');
        const categoriesList = document.getElementById('categoriesList');
        const editorPlaceholder = document.getElementById('editorPlaceholder');
        const editorContent = document.getElementById('editorContent');
        const searchLightbox = document.getElementById('searchLightbox');
        const globalSearchInput = document.getElementById('globalSearchInput');
        const globalResults = document.getElementById('globalResults');

        window.onload = () => { 
            renderCategories();
            renderNotes(); 
        };

        // Atalho de teclado para busca
        window.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                openSearchLightbox();
            }
            if (e.key === 'Escape') {
                closeSearchLightbox();
            }
        });

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
            const icon = document.getElementById('collapseIcon');
            icon.className = sidebar.classList.contains('collapsed') ? 'fa-solid fa-arrow-right' : 'fa-solid fa-bars';
        }

        function openSearchLightbox() {
            searchLightbox.classList.remove('hidden');
            globalSearchInput.focus();
            globalSearchInput.value = '';
            globalResults.innerHTML = `<div class="p-8 text-center text-slate-400">Digite algo para começar a buscar...</div>`;
        }

        function closeSearchLightbox() {
            searchLightbox.classList.add('hidden');
        }

        globalSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) {
                globalResults.innerHTML = `<div class="p-8 text-center text-slate-400">Digite algo para começar a buscar...</div>`;
                return;
            }

            const filtered = notes.filter(n => 
                (n.title || '').toLowerCase().includes(query) || 
                (n.content || '').toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                globalResults.innerHTML = `<div class="p-8 text-center text-slate-400">Nenhum resultado encontrado para "${e.target.value}"</div>`;
                return;
            }

            globalResults.innerHTML = filtered.map(note => `
                <div onclick="selectGlobalResult('${note.id}')" class="p-4 border-b border-white hover:bg-indigo-50 cursor-pointer transition flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl indicator-${note.color} flex items-center justify-center text-white shrink-0">
                        <i class="fa-regular fa-file-lines"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h4 class="font-bold text-slate-800 text-sm truncate">${escapeHTML(note.title) || 'Sem título'}</h4>
                        <p class="text-xs text-slate-400 line-clamp-1">${escapeHTML(note.content) || 'Sem conteúdo...'}</p>
                    </div>
                    <div class="ml-auto text-[10px] text-slate-300 font-bold uppercase">${note.category}</div>
                </div>
            `).join('');
        });

        function selectGlobalResult(id) {
            closeSearchLightbox();
            openNote(id);
        }

        function promptNewCategory() {
            const name = prompt("Nome da nova Etiqueta:");
            if (name && name.trim() !== "") {
                if (categories.includes(name.trim())) return showToast("Já existe!");
                categories.push(name.trim());
                saveCategories();
                renderCategories();
                showToast("Etiqueta adicionada!");
            }
        }

        function saveCategories() { localStorage.setItem('my_categories', JSON.stringify(categories)); }

        function renderCategories() {
            categoriesList.innerHTML = categories.map(cat => `
                <div onclick="filterByCategory('${cat}')" class="nav-item group ${currentFilter === cat ? 'active' : ''}">
                    <i class="fa-solid fa-hashtag w-5 text-[10px] opacity-40 text-center"></i>
                    <span class="truncate flex-grow hide-on-collapse">${cat}</span>
                    <button onclick="deleteCategory('${cat}', event)" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition ml-2 hide-on-collapse">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
            `).join('');
            
            document.getElementById('filterAll').classList.toggle('active', currentFilter === 'all');
            document.getElementById('filterFavorites').classList.toggle('active', currentFilter === 'favorites');
        }

        function deleteCategory(name, e) {
            e.stopPropagation();
            if (confirm(`Remover "${name}"?`)) {
                categories = categories.filter(c => c !== name);
                saveCategories();
                renderCategories();
                if (currentFilter === name) filterByCategory('all');
            }
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            renderCategories();
            renderNotes(searchBox.value);
        }

        function renderNotes(filter = '') {
            let filtered = notes.filter(n => {
                const matchesSearch = (n.title || '').toLowerCase().includes(filter.toLowerCase()) || (n.content || '').toLowerCase().includes(filter.toLowerCase());
                if (currentFilter === 'all') return matchesSearch;
                if (currentFilter === 'favorites') return n.isFavorite && matchesSearch;
                return n.category === currentFilter && matchesSearch;
            });

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                notesGrid.innerHTML = `<div class="p-12 text-center text-slate-300 text-sm">Sem notas aqui</div>`;
                return;
            }

            notesGrid.innerHTML = filtered.map(note => {
                const noteDate = new Date(note.date);
                const displayDate = noteDate.toLocaleDateString();
                const displayTime = noteDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                return `
                <div onclick="openNote('${note.id}')" class="note-list-item ${activeNoteId === note.id ? 'active' : ''}">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <div class="w-2 h-2 rounded-full indicator-${note.color} shrink-0"></div>
                            <h3 class="font-bold text-sm text-slate-800 truncate">${escapeHTML(note.title) || 'Sem título'}</h3>
                        </div>
                        ${note.isFavorite ? '<i class="fa-solid fa-star text-[10px] text-amber-400"></i>' : ''}
                    </div>
                    <p class="text-slate-400 text-xs line-clamp-2">${escapeHTML(note.content) || 'Sem conteúdo...'}</p>
                    <div class="mt-3 text-[10px] font-bold text-slate-300 uppercase tracking-wider flex justify-between">
                        <span>${displayDate}</span>
                        <span>${displayTime}</span>
                    </div>
                </div>
            `}).join('');
        }

        function createNewNote() {
            const id = Date.now().toString();
            const newNote = {
                id: id,
                title: '',
                content: '',
                color: 'blue',
                category: (currentFilter === 'all' || currentFilter === 'favorites') ? 'Ideias' : currentFilter,
                isFavorite: false,
                date: new Date().toISOString()
            };
            notes.unshift(newNote);
            saveNotes();
            openNote(id);
        }

        function openNote(id) {
            activeNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;

            editorPlaceholder.classList.add('hidden');
            editorContent.classList.remove('hidden');

            document.getElementById('editTitle').value = note.title;
            document.getElementById('editContent').value = note.content;
            document.getElementById('activeColorTag').className = `w-4 h-4 rounded-full mt-2 indicator-${note.color}`;
            
            const favIcon = document.getElementById('favoriteIcon');
            favIcon.className = note.isFavorite ? "fa-solid fa-star text-amber-400" : "fa-regular fa-star text-slate-300 hover:text-amber-400";

            document.getElementsByName('color').forEach(r => {
                r.checked = r.value === note.color;
            });

            renderNotes(searchBox.value);
        }

        function toggleFavoriteActive() {
            if (!activeNoteId) return;
            const index = notes.findIndex(n => n.id === activeNoteId);
            if (index !== -1) {
                notes[index].isFavorite = !notes[index].isFavorite;
                saveNotes();
                
                const favIcon = document.getElementById('favoriteIcon');
                favIcon.className = notes[index].isFavorite ? "fa-solid fa-star text-amber-400" : "fa-regular fa-star text-slate-300 hover:text-amber-400";
                
                renderNotes(searchBox.value);
                showToast(notes[index].isFavorite ? "Adicionado aos favoritos" : "Removido dos favoritos");
            }
        }

        const triggerSave = () => {
            if (!activeNoteId) return;
            document.getElementById('saveStatus').innerText = "A guardar...";
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                const index = notes.findIndex(n => n.id === activeNoteId);
                if (index !== -1) {
                    notes[index].title = document.getElementById('editTitle').value;
                    notes[index].content = document.getElementById('editContent').value;
                    notes[index].color = document.querySelector('input[name="color"]:checked').value;
                    notes[index].date = new Date().toISOString();
                    saveNotes();
                    renderNotes(searchBox.value);
                    document.getElementById('saveStatus').innerText = "Alterações salvas";
                }
            }, 1000);
        };

        document.getElementById('editTitle').addEventListener('input', triggerSave);
        document.getElementById('editContent').addEventListener('input', triggerSave);

        function updateNoteStyle() {
            const color = document.querySelector('input[name="color"]:checked').value;
            document.getElementById('activeColorTag').className = `w-4 h-4 rounded-full mt-2 indicator-${color}`;
            triggerSave();
        }

        function deleteActiveNote() {
            if (!activeNoteId) return;
            if (confirm("Eliminar esta nota permanentemente?")) {
                notes = notes.filter(n => n.id !== activeNoteId);
                activeNoteId = null;
                saveNotes();
                editorContent.classList.add('hidden');
                editorPlaceholder.classList.remove('hidden');
                renderNotes(searchBox.value);
                showToast("Nota removida.");
            }
        }

        function saveNotes() { localStorage.setItem('my_personal_notes', JSON.stringify(notes)); }

        function showToast(message) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            t.classList.replace('translate-y-20', 'translate-y-0');
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => {
                t.classList.replace('translate-y-0', 'translate-y-20');
                t.classList.replace('opacity-100', 'opacity-0');
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return "";
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        searchBox.addEventListener('input', (e) => renderNotes(e.target.value));
    </script>
</body>
</html>
